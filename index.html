<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Borimmm">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%238B1A1A' rx='32'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle' fill='%23FFD700'%3E♥%3C/text%3E%3C/svg%3E">
<title>Borimmm Share</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0D0505;
  --card:#1A0D10;
  --card2:#2A1418;
  --border:#3A2025;
  --accent:#8B1A1A;
  --accent2:#B22222;
  --gold:#D4AF37;
  --gold2:#FFD700;
  --pixie:#FF8FAB;
  --pixie2:#FFB6D3;
  --pixie3:#DDA0DD;
  --pixie-glow:rgba(255,143,171,0.3);
  --star:#FFF8DC;
  --text:#F5E6E8;
  --text2:#C4A0A8;
  --text3:#8A6068;
  --done:#4A7A5A;
  --done-bg:#1A2A1A;
  --shadow:0 2px 16px rgba(139,26,26,0.3);
  --shadow-pixie:0 0 20px rgba(255,143,171,0.15);
  --radius:14px;
  --radius-sm:10px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;
  overflow-x:hidden;
  position:relative;
}

/* ============ CANVAS PARTICLE LAYER ============ */
#particleCanvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ✨ Pixie Sparkle Background (static layer under canvas) */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, var(--pixie2) 50%, transparent 50%),
    radial-gradient(1px 1px at 30% 60%, var(--gold2) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 50% 10%, var(--pixie) 50%, transparent 50%),
    radial-gradient(1px 1px at 70% 40%, var(--gold) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 90% 70%, var(--pixie2) 50%, transparent 50%),
    radial-gradient(1px 1px at 20% 80%, var(--star) 50%, transparent 50%),
    radial-gradient(1px 1px at 60% 90%, var(--pixie3) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 80% 15%, var(--gold2) 50%, transparent 50%),
    radial-gradient(1px 1px at 15% 45%, var(--pixie) 50%, transparent 50%),
    radial-gradient(1px 1px at 45% 75%, var(--star) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 85% 50%, var(--pixie2) 50%, transparent 50%),
    radial-gradient(1px 1px at 5% 90%, var(--gold) 50%, transparent 50%),
    radial-gradient(1px 1px at 95% 30%, var(--pixie3) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 35% 35%, var(--star) 50%, transparent 50%),
    radial-gradient(1px 1px at 65% 65%, var(--pixie) 50%, transparent 50%);
  background-size:200px 200px;
  pointer-events:none;z-index:0;
  opacity:0.4;
  animation:twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle{
  0%{opacity:0.25}
  50%{opacity:0.5}
  100%{opacity:0.25}
}

/* ============ BUBU & DUDU DOM CHARACTERS ============ */
.bg-chars{
  position:fixed;top:0;left:0;right:0;bottom:0;
  pointer-events:none;z-index:1;overflow:hidden;
  will-change:transform;
}
.bg-char{
  position:absolute;
  will-change:transform;
  transition:opacity 0.3s;
}
.bg-char img{
  width:56px;height:56px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.15);
  box-shadow:0 4px 16px rgba(0,0,0,0.6);
  object-fit:cover;
  display:block;
}
/* Dudu spartan glow */
.bg-char.dudu img{
  box-shadow:0 0 20px rgba(212,175,55,0.3), 0 0 40px rgba(139,26,26,0.2);
  border-color:rgba(212,175,55,0.25);
}
/* Bubu pixie glow */
.bg-char.bubu img{
  box-shadow:0 0 20px rgba(255,143,171,0.3), 0 0 40px rgba(221,160,221,0.15);
  border-color:rgba(255,182,211,0.25);
}
.bg-char .emoji-overlay{
  position:absolute;font-size:22px;
  text-shadow:0 0 15px currentColor;
  pointer-events:none;
}
.bg-char.dudu .emoji-overlay{color:var(--gold2)}
.bg-char.bubu .emoji-overlay{color:var(--pixie2)}

/* Floating Hearts (DOM layer) */
.float-heart{
  position:absolute;
  pointer-events:none;
  z-index:1;
  font-size:14px;
  opacity:0.5;
  text-shadow:0 0 12px rgba(255,143,171,0.4);
  will-change:transform;
}

/* Header — Spartan + Pixie mix */
header{
  background:linear-gradient(135deg, #0D0505 0%, var(--accent) 50%, #3A0A20 100%);
  padding:22px 18px 16px;text-align:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(139,26,26,0.4), inset 0 0 40px rgba(255,143,171,0.05);
  border-bottom:1px solid rgba(212,175,55,0.15);
  position:relative;overflow:hidden;
}
header::before{
  content:'✦ ⋆｡°✩';position:absolute;top:4px;right:12px;
  font-size:10px;color:var(--pixie2);opacity:0.4;letter-spacing:4px;
}
header::after{
  content:'⚔';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--gold);opacity:0.2;
}
header h1{
  font-size:23px;font-weight:800;letter-spacing:1px;
  text-shadow:0 0 20px rgba(212,175,55,0.3);
}
header h1 .gwm{color:var(--gold2)}
header h1 .pix{color:var(--pixie2);text-shadow:0 0 15px var(--pixie-glow)}
header p{
  font-size:11px;color:var(--pixie2);margin-top:3px;
  opacity:0.7;letter-spacing:2px;
}
/* Tab Filter */
.tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;position:sticky;top:68px;z-index:99;
  background:var(--bg);border-bottom:1px solid var(--border);}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--text2);
  cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.tab.active{
  background:linear-gradient(135deg, var(--accent), #4A1020);border-color:var(--gold);
  color:var(--gold2);box-shadow:0 0 16px rgba(212,175,55,0.2), 0 0 8px var(--pixie-glow);
}
.tab .count{font-size:11px;color:var(--text3);margin-left:4px}
.tab.active .count{color:var(--pixie2)}
/* Input Bar */
.input-bar{
  display:flex;gap:8px;padding:10px 14px;position:sticky;top:112px;z-index:98;
  background:var(--bg);border-bottom:1px solid var(--border);padding-bottom:12px;
}
.input-bar input{flex:1;padding:12px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:15px;outline:none;transition:border 0.2s, box-shadow 0.2s;}
.input-bar input:focus{border-color:var(--pixie);box-shadow:0 0 12px var(--pixie-glow)}
.input-bar input::placeholder{color:var(--text3)}
.input-bar select{padding:12px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card);color:var(--text);
  font-size:13px;outline:none;cursor:pointer;min-width:85px;}
.input-bar select:focus{border-color:var(--gold)}
.btn-add{
  padding:12px 20px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg, var(--gold), #B8860B);
  color:#1A0A0A;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform 0.15s, box-shadow 0.2s;white-space:nowrap;
  box-shadow:0 0 8px rgba(212,175,55,0.2);
}
.btn-add:active{transform:scale(0.93)}
.btn-add:disabled{opacity:0.3;transform:none;box-shadow:none}
/* List */
.list{ padding:6px 14px;position:relative;z-index:1; }
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state .icon{font-size:52px;margin-bottom:12px;opacity:0.6;}
.empty-state p{font-size:14px;line-height:1.6}
/* Item */
.item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;margin-bottom:6px;
  background:linear-gradient(135deg, var(--card), var(--card2));
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  transition:all 0.25s;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,0.2);
}
.item:active{transform:scale(0.99)}
.item.done{
  background:linear-gradient(135deg, #1A1A1A, var(--done-bg));
  border-color:var(--done);opacity:0.7;
}
.item.done .item-content .text{text-decoration:line-through;color:var(--text3)}
.item-check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--text3);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.25s;
  position:relative;
}
.item.done .item-check{
  background:linear-gradient(135deg, var(--done), #2A5A3A);
  border-color:var(--done);
  box-shadow:0 0 8px rgba(74,122,90,0.3);
}
.item-check.checked::after{
  content:'✦';color:var(--gold2);font-size:16px;font-weight:bold;
  text-shadow:0 0 6px rgba(255,215,0,0.5);
}
.item-content{flex:1;min-width:0}
.item-content .text{font-size:15px;line-height:1.3;word-break:break-word}
.item-content .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.category-tag{font-size:10px;padding:2px 9px;border-radius:10px;font-weight:600;letter-spacing:0.3px}
.cat-belanja{background:rgba(139,26,26,0.2);color:var(--pixie);border:1px solid rgba(255,143,171,0.2)}
.cat-todo{background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.2)}
.cat-wishlist{background:rgba(221,160,221,0.15);color:var(--pixie3);border:1px solid rgba(221,160,221,0.2)}
.cat-lainnya{background:rgba(255,248,220,0.1);color:var(--star);border:1px solid rgba(255,248,220,0.15)}
.item-time{font-size:10px;color:var(--text3);margin-left:auto;text-align:right;line-height:1.4}
.item-time .author{color:var(--pixie2)}
.item-del{width:32px;height:32px;border-radius:50%;border:none;
  background:transparent;color:var(--text3);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all 0.2s;}
.item-del:active{background:var(--accent2);color:var(--gold2)}
/* Status bar */
.status-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  padding:8px 14px;font-size:11px;text-align:center;backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;gap:8px;
  border-top:1px solid var(--border);
}
.status-bar.connected{background:rgba(10,20,10,0.95);color:#7AC08A}
.status-bar.disconnected{background:rgba(30,10,10,0.95);color:var(--pixie)}
.status-bar .dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;
  box-shadow:0 0 6px currentColor;
}
.status-bar.connected .dot{background:#7AC08A}
.status-bar.disconnected .dot{background:var(--pixie)}
.status-bar .users{color:var(--pixie2);margin-left:auto;letter-spacing:0.5px}
/* Loading */
.loading{text-align:center;padding:30px;color:var(--text3);font-size:13px}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.item{animation:fadeIn 0.2s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,0.5)}70%{box-shadow:0 0 0 12px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}
.btn-add.pulse{animation:pulse 0.5s}
@keyframes sparkleIn{
  0%{opacity:0;transform:scale(0.8) rotate(-3deg)}
  50%{opacity:0.8}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
.item:first-child{animation:sparkleIn 0.3s ease}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(13, 5, 5, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.modal-content {
  background: linear-gradient(135deg, var(--card), var(--card2));
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 90%;
  max-width: 340px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(212,175,55,0.2);
  animation: modalScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalScale {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-content h3 {
  font-size: 18px;
  margin-bottom: 18px;
  color: var(--gold2);
  text-shadow: 0 0 10px rgba(212,175,55,0.3);
  font-weight: 700;
}
.modal-content input {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
  text-align: center;
  margin-bottom: 20px;
  transition: border 0.2s, box-shadow 0.2s;
}
.modal-content input:focus {
  border-color: var(--pixie);
  box-shadow: 0 0 12px var(--pixie-glow);
}
.btn-primary {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: linear-gradient(135deg, var(--gold), #B8860B);
  color: #1A0A0A;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(212,175,55,0.3);
  transition: transform 0.1s;
}
.btn-primary:active {
  transform: scale(0.97);
}

/* Responsive */
@media(max-width:400px){
  .bg-char img{width:40px;height:40px}
}
</style>

<canvas id="particleCanvas"></canvas>

<!-- BUBU & DUDU LIVE BACKGROUND (DOM layer on top of canvas) -->
<div class="bg-chars" id="bgChars">
  <!-- DUDU — Spartan Warrior (populated by JS) -->
  <!-- BUBU — Pixie Fairy (populated by JS) -->
  <!-- Hearts (populated by JS) -->
</div>

<!-- Name Input Modal -->
<div id="nameModal" class="modal-overlay" style="display: none;">

    <h3>Siapa nama kamu, manis? ✦</h3>

    <button id="btnSaveName" class="btn-primary">Masuk ♥</button>
  </div>
</div>

<header>
  <h1>⚔ ♥ BORIMMM <span class="pix">SHARE</span> <span class="gwm">♥</span> ✨</h1>
  <p>✦ Bubu 💕 Dudu  ~  spartan hearts, pixie souls ✦</p>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-filter="all">Semua <span class="count" id="c-all"></span></div>
  <div class="tab" data-filter="belanja">🛒 Belanja <span class="count" id="c-belanja"></span></div>
  <div class="tab" data-filter="todo">✅ To-Do <span class="count" id="c-todo"></span></div>
  <div class="tab" data-filter="wishlist">⭐ Wishlist <span class="count" id="c-wishlist"></span></div>
  <div class="tab" data-filter="lainnya">📦 Lainnya <span class="count" id="c-lainnya"></span></div>

  <span class="dot"></span>
  <span id="statusText">Menghubungkan...</span>
  <span class="users" id="usersOnline"></span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ================================================================
//  PARTICLE SYSTEM — Canvas-based live wallpaper engine
// ================================================================

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---- Particle Classes ----

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'fire', 'sparkle', 'heart', 'burstHeart', 'burstFire'
    this.init();
  }
  init() {
    switch(this.type) {
      case 'fire':
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = -(Math.random() * 1.5 + 0.5);
        this.size = Math.random() * 4 + 2;
        this.life = 1;
        this.maxLife = Math.random() * 60 + 40;
        this.decay = 1 / this.maxLife;
        this.colors = ['#FF4500','#FF6600','#FFD700','#FF8C00','#FF0000'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        break;
      case 'sparkle':
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = -(Math.random() * 0.6 + 0.2);
        this.size = Math.random() * 3 + 1.5;
        this.life = 1;
        this.maxLife = Math.random() * 80 + 50;
        this.decay = 1 / this.maxLife;
        this.colors = ['#FFB6D3','#FF8FAB','#DDA0DD','#FFD700','#FFF8DC'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        this.twinkle = Math.random() * Math.PI * 2;
        this.twinkleSpeed = Math.random() * 0.05 + 0.02;
        break;
      case 'heart':
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = Math.random() * 0.8 + 0.3;
        this.size = Math.random() * 10 + 8;
        this.life = 1;
        this.maxLife = Math.random() * 200 + 150;
        this.decay = 1 / this.maxLife;
        this.colors = ['#FF6B8A','#FF8FAB','#FFB6D3','#FF1493','#FF69B4','#DDA0DD'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        this.swing = Math.random() * Math.PI * 2;
        this.swingSpeed = Math.random() * 0.02 + 0.01;
        this.swingAmp = Math.random() * 30 + 10;
        this.heartChar = Math.random() > 0.5 ? '♥' : '💕';
        break;
      case 'burstHeart':
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1;
        this.size = Math.random() * 14 + 10;
        this.life = 1;
        this.maxLife = Math.random() * 50 + 40;
        this.decay = 1 / this.maxLife;
        this.colors = ['#FF6B8A','#FF8FAB','#FFB6D3','#FF1493','#FF69B4'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        this.heartChar = Math.random() > 0.3 ? '♥' : '💕';
        break;
      case 'burstFire':
        const a2 = Math.random() * Math.PI * 2;
        const s2 = Math.random() * 5 + 2;
        this.vx = Math.cos(a2) * s2;
        this.vy = Math.sin(a2) * s2 - 1;
        this.size = Math.random() * 5 + 2;
        this.life = 1;
        this.maxLife = Math.random() * 30 + 25;
        this.decay = 1 / this.maxLife;
        this.colors = ['#FF4500','#FF6600','#FFD700','#FF8C00','#FF0000','#FFFF00'];
        this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        break;
    }
    this.alpha = 1;
  }
  update(delta) {
    this.life -= this.decay * (delta / 16);
    this.alpha = Math.max(0, this.life);
    this.x += this.vx * (delta / 16);
    this.y += this.vy * (delta / 16);

    switch(this.type) {
      case 'fire':
        this.vx += (Math.random() - 0.5) * 0.05;
        this.size *= 0.995;
        break;
      case 'sparkle':
        this.twinkle += this.twinkleSpeed * (delta / 16);
        this.vx += (Math.random() - 0.5) * 0.02;
        break;
      case 'heart':
        this.swing += this.swingSpeed * (delta / 16);
        this.x += Math.sin(this.swing) * this.swingAmp * 0.01;
        this.vy += 0.002 * (delta / 16); // gravity
        break;
      case 'burstHeart':
        this.vy += 0.03 * (delta / 16); // gravity
        this.vx *= 0.99;
        break;
      case 'burstFire':
        this.vy += 0.02 * (delta / 16);
        this.vx *= 0.98;
        this.size *= 0.99;
        break;
    }
    return this.life > 0;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    if (this.type === 'sparkle') {
      const s = this.size * (0.5 + 0.5 * Math.sin(this.twinkle));
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = this.color;
      // Star shape
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.5, s), 0, Math.PI * 2);
      ctx.fill();
      // Cross glow
      ctx.globalAlpha = this.alpha * 0.4;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(this.x - s * 3, this.y);
      ctx.lineTo(this.x + s * 3, this.y);
      ctx.moveTo(this.x, this.y - s * 3);
      ctx.lineTo(this.x, this.y + s * 3);
      ctx.stroke();
    } else if (this.type === 'heart' || this.type === 'burstHeart') {
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 15;
      ctx.fillStyle = this.color;
      ctx.font = `${Math.max(6, this.size)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.heartChar, this.x, this.y);
    } else if (this.type === 'fire' || this.type === 'burstFire') {
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 20;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.5, this.size), 0, Math.PI * 2);
      ctx.fill();
      // Inner glow
      ctx.globalAlpha = this.alpha * 0.5;
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#FFFFAA';
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(0.3, this.size * 0.4), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---- Particle Emitters ----

let particles = [];
let frameCount = 0;

// Emitter positions (relative to viewport)
const emitters = {
  duduFires: [
    {x: 0.06, y: 0.82, rate: 3},
    {x: 0.92, y: 0.70, rate: 2},
    {x: 0.03, y: 0.60, rate: 2},
    {x: 0.96, y: 0.40, rate: 1.5},
  ],
  bubuSparkles: [
    {x: 0.90, y: 0.15, rate: 3},
    {x: 0.07, y: 0.28, rate: 2.5},
    {x: 0.93, y: 0.75, rate: 2},
    {x: 0.04, y: 0.50, rate: 1.5},
    {x: 0.40, y: 0.10, rate: 1.5},
  ]
};

function emitParticles() {
  // Fire from Dudu positions
  for (const e of emitters.duduFires) {
    if (Math.random() < e.rate * 0.02) {
      particles.push(new Particle(e.x * W + (Math.random() - 0.5) * 20, e.y * H + (Math.random() - 0.5) * 10, 'fire'));
    }
  }
  // Sparkles from Bubu positions
  for (const e of emitters.bubuSparkles) {
    if (Math.random() < e.rate * 0.025) {
      particles.push(new Particle(e.x * W + (Math.random() - 0.5) * 20, e.y * H + (Math.random() - 0.5) * 10, 'sparkle'));
    }
  }
  // Heart rain (continuous)
  if (Math.random() < 0.06) {
    particles.push(new Particle(Math.random() * W, -10, 'heart'));
  }
}

function addBurst(x, y, type) {
  const count = type === 'heart' ? 20 : 25;
  const pType = type === 'heart' ? 'burstHeart' : 'burstFire';
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, pType));
  }
}

// ---- DOM Character Animation (requestAnimationFrame) ----

const bgChars = document.getElementById('bgChars');
const charData = [];

// Dudu characters
const duduEmojis = ['🛡️', '🔥', '⚔️', '💀', '🗡️', '👑'];
const duduPositions = [
  {x: 0.05, y: 0.88, img: 'assets/dudu_spartan.png'},
  {x: 0.08, y: 0.70, img: null},
  {x: 0.93, y: 0.72, img: null},
  {x: 0.04, y: 0.42, img: null},
  {x: 0.95, y: 0.35, img: null},
  {x: 0.50, y: 0.92, img: null},
];

const bubuEmojis = ['✨', '🌸', '🧚', '🦋', '💫', '🌙'];
const bubuPositions = [
  {x: 0.88, y: 0.12, img: 'assets/bubu_fairy.png'},
  {x: 0.10, y: 0.25, img: null},
  {x: 0.90, y: 0.78, img: null},
  {x: 0.06, y: 0.52, img: null},
  {x: 0.40, y: 0.08, img: null},
  {x: 0.60, y: 0.15, img: null},
];

// Build DOM characters
function buildDOMChars() {
  bgChars.innerHTML = '';
  charData.length = 0;

  // Dudu chars
  duduPositions.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'bg-char dudu';
    if (pos.img) {
      el.innerHTML = `<img src="${pos.img}" alt="Dudu Spartan">`;
    } else {
      el.innerHTML = `<span class="emoji-overlay" style="font-size:26px">${duduEmojis[i % duduEmojis.length]}</span>`;
    }
    bgChars.appendChild(el);
    charData.push({
      el, type: 'dudu',
      baseX: pos.x, baseY: pos.y,
      phase: Math.random() * Math.PI * 2,
      speed: 0.003 + Math.random() * 0.002,
      ampX: 8 + Math.random() * 15,
      ampY: 10 + Math.random() * 18,
      rotSpeed: (Math.random() - 0.5) * 0.002,
      rot: 0,
      scale: 0.85 + Math.random() * 0.3,
    });
  });

  // Bubu chars
  bubuPositions.forEach((pos, i) => {
    const el = document.createElement('div');
    el.className = 'bg-char bubu';
    if (pos.img) {
      el.innerHTML = `<img src="${pos.img}" alt="Bubu Fairy">`;
    } else {
      el.innerHTML = `<span class="emoji-overlay" style="font-size:24px">${bubuEmojis[i % bubuEmojis.length]}</span>`;
    }
    bgChars.appendChild(el);
    charData.push({
      el, type: 'bubu',
      baseX: pos.x, baseY: pos.y,
      phase: Math.random() * Math.PI * 2,
      speed: 0.002 + Math.random() * 0.002,
      ampX: 12 + Math.random() * 20,
      ampY: 8 + Math.random() * 15,
      rotSpeed: (Math.random() - 0.5) * 0.003,
      rot: 0,
      scale: 0.85 + Math.random() * 0.3,
      wingPhase: 0,
    });
  });
}
buildDOMChars();

// ---- Parallax ----

let scrollY = 0;
window.addEventListener('scroll', () => {
  scrollY = window.scrollY;
}, {passive: true});

// ---- RAF Animation Loop ----

let lastTime = 0;

function animate(time) {
  const delta = Math.min(time - lastTime, 50); // cap at 50ms
  lastTime = time;
  frameCount++;

  // --- Clear canvas ---
  ctx.clearRect(0, 0, W, H);

  // --- Update & draw particles ---
  emitParticles();
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update(delta)) {
      particles.splice(i, 1);
    } else {
      particles[i].draw();
    }
  }

  // Limit particles
  if (particles.length > 400) {
    particles.splice(0, particles.length - 400);
  }

  // --- Update DOM characters ---
  for (const c of charData) {
    c.phase += c.speed * (delta / 16);
    if (c.type === 'bubu') c.wingPhase += 0.08 * (delta / 16);

    // Parallax: move slower when scrolling
    const parallaxFactor = c.type === 'dudu' ? 0.08 : 0.04;
    const parallaxOffset = scrollY * parallaxFactor;

    // Organic movement
    const xOff = Math.sin(c.phase) * c.ampX + Math.sin(c.phase * 0.7) * c.ampX * 0.3;
    const yOff = Math.cos(c.phase * 0.8) * c.ampY + Math.sin(c.phase * 1.3) * c.ampY * 0.2;

    let x = c.baseX * W + xOff;
    let y = c.baseY * H + yOff - parallaxOffset;

    c.rot += c.rotSpeed * (delta / 16);
    const rot = c.rot + (c.type === 'bubu' ? Math.sin(c.wingPhase) * 0.05 : Math.sin(c.phase * 0.5) * 0.03);

    // Floating scale pulse for bubu (wing flap)
    let scale = c.scale;
    if (c.type === 'bubu') {
      scale *= 0.95 + 0.05 * Math.sin(c.wingPhase * 2);
    }

    c.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}rad) scale(${scale})`;
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---- Interactive: Touch/Click burst effects ----

function handleInteraction(x, y) {
  // Check if tapped on interactive area (not on UI elements)
  const target = document.elementFromPoint(x, y);
  if (target && (target.closest('.tabs') || target.closest('.input-bar') || target.closest('header') ||
      target.closest('.status-bar') || target.closest('.list') || target.closest('.modal-overlay'))) {
    return; // Don't trigger on UI
  }

  // Burst hearts + fire/sparkles based on position
  // Left side = Dudu fire, Right side = Bubu sparkles, Center = hearts
  if (x < W * 0.4) {
    addBurst(x, y, 'fire');
  } else if (x > W * 0.6) {
    addBurst(x, y, 'heart');
  } else {
    // Middle = mix!
    addBurst(x, y, 'heart');
    setTimeout(() => addBurst(x, y, 'fire'), 100);
  }
}

// Touch events
document.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  handleInteraction(touch.clientX, touch.clientY);
}, {passive: true});

// Click events (for desktop)
document.addEventListener('click', (e) => {
  handleInteraction(e.clientX, e.clientY);
});

// Window resize update
window.addEventListener('resize', () => {
  resizeCanvas();
  // Reposition DOM chars based on new W/H
  for (const c of charData) {
    c.el.style.transform = `translate(${c.baseX * W}px, ${c.baseY * H}px)`;
  }
});

// ---- Performance: throttle on mobile ----
let lowPerf = false;
// Check every 30 seconds, reduce particles if needed
setInterval(() => {
  if (particles.length > 300) {
    // Remove oldest particles
    particles.splice(0, Math.floor(particles.length * 0.3));
  }
}, 30000);

// ================================================================
//  FIREBASE APP — Shared List
// ================================================================

let firebaseOk = false;
try {
  if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "ISI_API_KEY_DISINI") {
    firebase.initializeApp(firebaseConfig);
    firebaseOk = true;
  }
} catch(e) {}

let currentFilter = "all";
let allItems = {};
let userId = null;
let userName = "Aku";
let dbRef = null;
let connectedUsers = 0;
let myRef = null;

const listEl = document.getElementById("listContainer");
const inputEl = document.getElementById("itemInput");
const btnAdd = document.getElementById("btnAdd");
const catSelect = document.getElementById("categorySelect");
const statusBar = document.getElementById("statusBar");
const statusText = document.getElementById("statusText");
const usersOnline = document.getElementById("usersOnline");

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}

// Auth & DB
async function initApp() {
  if (!firebaseOk) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="icon">⚙️</div>
      <p><b>Belum dikonfigurasi</b><br>Isi dulu Firebase config di file <code>firebase-config.js</code><br><br>
      📖 Baca <b>README.md</b> untuk panduan</p>
    </div>`;
    statusBar.className = "status-bar disconnected";
    statusText.textContent = "Konfigurasi Firebase dulu";
    return;
  }

  const savedName = localStorage.getItem("borimmm_name");
  if (savedName) {
    userName = savedName;
    await startFirebaseSession();
  } else {
    const nameModal = document.getElementById("nameModal");
    const modalNameInput = document.getElementById("modalNameInput");
    const btnSaveName = document.getElementById("btnSaveName");
    
    nameModal.style.display = "flex";
    modalNameInput.focus();
    
    const saveNameFn = async () => {
      let name = modalNameInput.value.trim();
      if (!name) name = "Aku";
      userName = name;
      localStorage.setItem("borimmm_name", userName);
      nameModal.style.display = "none";
      await startFirebaseSession();
    };
    
    btnSaveName.onclick = saveNameFn;
    modalNameInput.onkeydown = (e) => {
      if (e.key === "Enter") saveNameFn();
    };
  }
}

async function startFirebaseSession() {
  try {
    const userCred = await firebase.auth().signInAnonymously();
    userId = userCred.user.uid;

    const presenceRef = firebase.database().ref(".info/connected");
    myRef = firebase.database().ref("presence/" + userId);

    presenceRef.on("value", async (snap) => {
      if (snap.val()) {
        myRef.onDisconnect().remove();
        await myRef.set({name: userName, online: true, lastSeen: Date.now()});
      }
    });

    firebase.database().ref("presence").on("value", (snap) => {
      const data = snap.val() || {};
      connectedUsers = Object.keys(data).length;
      const names = Object.values(data).map(d=>d.name);
      const unique = [...new Set(names)];
      if (connectedUsers > 1) {
        usersOnline.textContent = `⚔♥ ${unique.join(" & ")} ♥✦`;
      } else {
        usersOnline.textContent = `💔 menunggu...`;
      }
    });

    dbRef = firebase.database().ref("items");

    dbRef.on("value", (snap) => {
      allItems = snap.val() || {};
      renderList();
      updateCounts();
    });

    statusBar.className = "status-bar connected";
    statusText.textContent = "✦ Terhubung ✦";

  } catch(e) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="icon">❌</div>
      <p><b>Koneksi gagal</b><br>${e.message}</p>
    </div>`;
    statusBar.className = "status-bar disconnected";
    statusText.textContent = "Gagal: " + e.message;
  }
}

// Render
function renderList() {
  const entries = Object.entries(allItems);
  if (entries.length === 0) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="icon">✨📝✨</div>
      <p><b>Masih kosong, prajurit kecil ✦</b><br>Tambah item pertama kalian! ♥</p>
    </div>`;
    return;
  }

  const sorted = entries
    .map(([k,v]) => ({id:k, ...v}))
    .sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

  const filtered = currentFilter === "all"
    ? sorted
    : sorted.filter(i => i.category === currentFilter);

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="icon">📍</div>
      <p><b>Kosong di sini</b><br>Belum ada item kategori ini</p>
    </div>`;
    return;
  }

  let html = "";
  for (const item of filtered) {
    const catLabel = {belanja:"🛒",todo:"✅",wishlist:"⭐",lainnya:"📦"}[item.category]||"📦";
    const done = item.done ? "done" : "";
    const checked = item.done ? "checked" : "";
    const time = item.createdAt ? new Date(item.createdAt).toLocaleDateString("id", {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
    const author = item.author ? `oleh ${item.author}` : "";

    html += `<div class="item ${done}" data-id="${item.id}">
      <div class="item-check ${checked}" onclick="toggleItem('${item.id}')"></div>
      <div class="item-content">
        <div class="text">${escapeHtml(item.text)}</div>
        <div class="meta">
          <span class="category-tag cat-${item.category}">${catLabel} ${item.category}</span>
          ${item.note ? `<span style="font-size:11px;color:var(--text3)">📎 ${escapeHtml(item.note)}</span>` : ""}
        </div>
      </div>
      <div class="item-time">
        ${time ? `<span>${time}</span>` : ""}
        ${author ? `<span class="author"> ${author}</span>` : ""}
      </div>
      <button class="item-del" onclick="deleteItem('${item.id}')">✕</button>
    </div>`;
  }
  listEl.innerHTML = html;
}

function updateCounts() {
  const entries = Object.values(allItems);
  const cats = {all: entries.length, belanja:0, todo:0, wishlist:0, lainnya:0};
  for (const e of entries) {
    if (cats[e.category] !== undefined) cats[e.category]++;
  }
  for (const [k,v] of Object.entries(cats)) {
    const el = document.getElementById("c-" + k);
    if (el) el.textContent = v;
  }
}

// Actions
async function addItem() {
  const text = inputEl.value.trim();
  if (!text || !dbRef) return;

  const category = catSelect.value;
  btnAdd.disabled = true;
  btnAdd.classList.add("pulse");
  setTimeout(() => btnAdd.classList.remove("pulse"), 600);

  try {
    await dbRef.push({
      text: text,
      category: category,
      done: false,
      author: userName,
      createdAt: Date.now()
    });
    inputEl.value = "";
    inputEl.focus();
  } catch(e) {
    alert("Gagal: " + e.message);
  }
  btnAdd.disabled = false;
}

async function toggleItem(id) {
  if (!dbRef) return;
  const item = allItems[id];
  if (!item) return;
  try {
    await dbRef.child(id).update({done: !item.done});
  } catch(e) {}
}

async function deleteItem(id) {
  if (!dbRef) return;
  try {
    await dbRef.child(id).remove();
  } catch(e) {}
}

// Tabs
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentFilter = tab.dataset.filter;
    renderList();
  });
});

// Input
inputEl.addEventListener("input", () => {
  btnAdd.disabled = !inputEl.value.trim();
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !btnAdd.disabled) addItem();
});
btnAdd.addEventListener("click", addItem);

// Utils
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// Start
initApp();

if (firebaseOk) {
  firebase.database().ref(".info/connected").on("value", (snap) => {
    if (snap.val() === false) {
      statusBar.className = "status-bar disconnected";
      statusText.textContent = "✦ Terputus ✦";
    }
  });
}
</script>
